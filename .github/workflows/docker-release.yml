name: Docker Release

on:
  push:
    branches: [main]
    paths:
      # Only build when Docker or source files change
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker'
      - 'server/src/**'
      - 'server/package.json'
      - 'server/tsconfig.json'
      - 'server/drizzle/**'
      - 'admin/src/**'
      - 'admin/package.json'
      - 'admin/tsconfig.json'
      - 'admin/index.html'
      - 'admin/vite.config.ts'
      - 'website/src/**'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'website/tsconfig.json'
      - 'website/index.html'
      - 'website/vite.config.ts'
      - 'website/postcss.config.js'
      - 'website/tailwind.config.ts'
      - 'server/package-lock.json'
      - 'admin/package-lock.json'
      - '.github/workflows/docker-release.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image names: ghcr.io/OWNER/REPO/predator-server, ghcr.io/OWNER/REPO/predator-nginx
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Typecheck & test server before building Docker images ──
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --run

  # ── Typecheck admin & website (their Dockerfile skips tsc) ──
  typecheck-admin:
    name: Typecheck Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  typecheck-website:
    name: Typecheck Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # ── Build & push Docker images ──
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test-server, typecheck-admin, typecheck-website]
    permissions:
      contents: read
      packages: write  # Required for GHCR push

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: predator-server
            dockerfile: docker/server.Dockerfile
          - image: predator-nginx
            dockerfile: docker/nginx.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # Main branch pushes get: main, <sha>, latest
          # Semantic version tags come from the separate release.yml workflow
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
