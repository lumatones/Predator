name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

      - name: Build .exe (with correct version)
        run: npx electron-builder --win -c.extraMetadata.version=${GITHUB_REF_NAME#v}

      - name: Create Release & Upload .exe
        run: |
          gh release create "${{ github.ref_name }}" \
            release/Predator-*.exe \
            release/latest*.yml \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
