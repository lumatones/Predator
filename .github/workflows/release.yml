name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ${{ github.ref_name }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck:electron

      - name: Build (Vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Predator ${{ github.ref_name }}
          body: |
            ## Predator ${{ github.ref_name }}

            ### Changes
            _Автоматически сгенерировано из коммитов._

            Полный список изменений доступен в [истории коммитов](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
