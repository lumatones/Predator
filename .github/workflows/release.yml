name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

      - name: Update version from tag & Build .exe
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Building version: $VER"
          npm version $VER --no-git-tag-version --allow-same-version
          npx electron-builder --win

      - name: Create Release & Upload .exe
        run: |
          FILES="release/Predator-*.exe"
          # latest.yml only generated when publish provider is configured
          if ls release/latest*.yml 2>/dev/null; then
            FILES="$FILES release/latest*.yml"
          fi
          gh release create "${{ github.ref_name }}" $FILES --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
