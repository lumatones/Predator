name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build

      - name: Build .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Create Release & Upload .exe
        shell: bash
        run: |
          shopt -s nullglob
          EXE_FILES=(release/Predator-*.exe)
          YML_FILES=(release/latest*.yml)
          ALL_FILES=("${EXE_FILES[@]}" "${YML_FILES[@]}")
          if [ ${#ALL_FILES[@]} -gt 0 ]; then
            gh release create "${{ github.ref_name }}" "${ALL_FILES[@]}" --generate-notes
          else
            echo "No files to upload — build may have failed"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
