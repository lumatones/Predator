name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ── Cache node_modules (npm ci takes 10-15 min on Windows without cache) ──
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      # ── Cache Electron binary + build tools (Windows paths) ──
      # electron-builder defaults: %LOCALAPPDATA%/electron/Cache, %APPDATA%/electron-builder
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/electron/Cache
            ${{ env.APPDATA }}/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck & Build
        run: npm run build

      - name: Build .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Create Release & Upload .exe
        shell: bash
        run: |
          shopt -s nullglob
          EXE_FILES=(release/Predator-*.exe)
          YML_FILES=(release/latest*.yml)
          ALL_FILES=("${EXE_FILES[@]}" "${YML_FILES[@]}")
          if [ ${#ALL_FILES[@]} -gt 0 ]; then
            gh release create "${{ github.ref_name }}" "${ALL_FILES[@]}" --generate-notes
          else
            echo "No files to upload — build may have failed"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
