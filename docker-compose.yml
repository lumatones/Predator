# ── Predator Docker Compose ──
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
#
# The db-migrate service runs drizzle-kit migrate automatically
# on first start. No manual steps needed.

services:
  # ── MySQL 8 ──
  mysql:
    image: mysql:8.0
    container_name: predator-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-predator}
      MYSQL_USER: ${DB_USER:-predator}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    volumes:
      - mysql-data:/var/lib/mysql
    # No external port — mysql communicates internally via Docker network.
    # To connect from host: use docker compose exec mysql mysql -u root -p
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - predator-net

  # ── DB Migrations (programmatic, via drizzle-orm) ──
  # One-shot container — applies SQL migrations and exits.
  # Uses drizzle-orm's migrate() — no drizzle-kit CLI needed.
  db-migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: predator-db-migrate
    restart: "no"
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]
    networks:
      - predator-net

  # ── Server (Express API) ──
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: predator-server
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # No external port — server communicates internally via Docker network.
    # Access through nginx at http://localhost/api/
    networks:
      - predator-net

  # ── Nginx (Admin + Website + API proxy + HTTPS) ──
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: predator-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - predator-net

  # ── Certbot (Let's Encrypt) ──
  certbot:
    image: certbot/certbot
    container_name: predator-certbot
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        DOMAIN="${DOMAIN:-localhost}"
        if [ ! -d "/etc/letsencrypt/live/${DOMAIN}" ]; then
          echo "[certbot] Obtaining SSL certificate for ${DOMAIN}..."
          certbot certonly --webroot \
            --webroot-path=/var/www/certbot \
            -d "${DOMAIN}" \
            --non-interactive --agree-tos \
            -m "${SSL_EMAIL:-admin@example.com}" || {
              echo "[certbot] FAILED to obtain certificate. Check DOMAIN and DNS."
              echo "[certbot] Nginx will serve a self-signed cert until fixed."
            }
        else
          echo "[certbot] Certificate already exists for ${DOMAIN}"
        fi
        # Renewal loop: check every 12 hours.
        # After renewal, restart nginx to pick up new cert:
        #   docker compose restart nginx
        while :; do
          certbot renew --quiet || true
          sleep 12h
        done
    networks:
      - predator-net

volumes:
  mysql-data:
    name: predator-mysql-data
  certbot-data:
    name: predator-certbot-data
  certbot-webroot:
    name: predator-certbot-webroot

networks:
  predator-net:
    name: predator-net
    driver: bridge
